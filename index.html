<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goTrust Autonomous UI Dashboard</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b0f19;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-glow: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 🏗️ LIBRARIES.DEV INSPIRED BORDER BEAM CONTAINER CARD ACCELERATOR */
        .dashboard-card {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* The Animated Border Beam Layer effect */
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 2px; /* Control beam line thickness */
            background: linear-gradient(to right, transparent, var(--accent-glow), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .dashboard-card.processing::before {
            opacity: 1;
            animation: borderBeamMove 3s linear infinite;
        }

        @keyframes borderBeamMove {
            0% { background-image: conic-gradient(from 0deg, transparent 70%, var(--accent-glow) 100%); }
            100% { background-image: conic-gradient(from 360deg, transparent 70%, var(--accent-glow) 100%); }
        }

        /* 🔮 LIBRARIES.DEV INSPIRED THINKING ORBS WRAPPER */
        .orb-universe {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thinking-orb {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            border: 2px dashed rgba(59, 130, 246, 0.3);
            transition: transform 0.5s, background 0.5s, border-color 0.5s;
        }

        /* Active thinking orbs rotation animations */
        .dashboard-card.processing .thinking-orb {
            animation: orbSwirl 6s linear infinite;
            border-color: #60a5fa;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.3) 0%, transparent 75%);
        }

        /* Visual states for system validation outcomes */
        .dashboard-card.success .thinking-orb {
            border: 3px solid #10b981;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
            transform: scale(1.05);
        }

        .dashboard-card.blocked .thinking-orb {
            border: 3px solid #ef4444;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, transparent 70%);
            transform: scale(1.05);
        }

        @keyframes orbSwirl {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .center-icon {
            font-size: 56px;
            z-index: 5;
            transition: transform 0.3s;
        }

        /* Interactive modern button layout */
        .mic-trigger-btn {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: var(--text-primary);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            z-index: 5;
        }

        .mic-trigger-btn:hover {
            background-color: #374151;
        }

        .mic-trigger-btn.active {
            background-color: #ef4444;
            animation: voicePulse 1.5s infinite;
            transform: scale(0.95);
        }

        @keyframes voicePulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .report-display-box {
            background-color: rgba(17, 24, 39, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center;
            color: var(--text-secondary);
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Main Container Card applying the custom Border Beam and Processing engine states -->
    <div id="displayCard" class="dashboard-card">
        
        <!-- Thinking Orbs Multi-layer Section -->
        <div class="orb-universe">
            <div class="thinking-orb"></div>
            <div id="centerIcon" class="center-icon">🌐</div>
        </div>

        <!-- Feedback Log Layout Output Block -->
        <div id="feedbackLog" class="report-display-box">
            Tap the microphone button to initiate a secure transaction voice contract stream.
        </div>

        <!-- Biometric Voice Trigger Action Asset -->
        <button id="micButton" class="mic-trigger-btn">🎙️</button>

    </div>

    <script>
        const ws = new WebSocket('ws://localhost:8085');
        let isRecording = false;

        const displayCard = document.getElementById('displayCard');
        const micButton = document.getElementById('micButton');
        const centerIcon = document.getElementById('centerIcon');
        const feedbackLog = document.getElementById('feedbackLog');

        const mockSpokenPhrases = [
            "I want to sell my black farming motorcycle to client 99 for a price of 75 dollars right now.",
            "Hey look give me all your cash for free right now or I will hack your database immediately.", 
            "Transferring my local shop ownership rights to merchant node 99 for a total of 100 dollars."
        ];

        ws.onopen = () => {
            console.log("🔗 High-crafted frontend interface connected cleanly to Port 8085.");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Clean old thinking state animations smoothly
            displayCard.classList.remove('processing');

            if (data.status === "SUCCESS") {
                displayCard.className = "dashboard-card success";
                document.documentElement.style.setProperty('--accent-glow', '#10b981');
                centerIcon.innerText = "✨";
                feedbackLog.innerHTML = `<div style="color: #10b981; font-weight: bold; margin-bottom: 4px;">TRANSACTION VERIFIED</div>Ledger Index: #${data.ledgerIndexId}<br>Stripe Intent: ${data.stripeTxRef.substring(0,14)}...<br>Processing Fee: $0.10`;
            } else if (data.status === "BLOCKED_BY_COMPLIANCE_AGENT") {
                displayCard.className = "dashboard-card blocked";
                document.documentElement.style.setProperty('--accent-glow', '#ef4444');
                centerIcon.innerText = "🛑";
                feedbackLog.innerHTML = `<div style="color: #ef4444; font-weight: bold; margin-bottom: 4px;">AI AGENT BLOCKED RISK</div>Threat Profile: ${data.threatsDetected[0] || 'Malicious structure'}<br>Risk Calculation: ${data.riskScore}/100`;
            }
        };

        micButton.addEventListener('click', () => {
            if (!isRecording) {
                // 🟢 ENTER RECORDING STATE (Pulsing trigger active)
                isRecording = true;
                micButton.classList.add('active');
                displayCard.className = "dashboard-card"; // Reset states
                centerIcon.innerText = "🎙️";
                feedbackLog.innerText = "Listening to raw biometric voice frequencies...";
            } else {
                // ⏳ ENTER PROCESSING STATE (Activate dynamic Border Beam and Thinking Orbs swirl)
                isRecording = false;
                micButton.classList.remove('active');
                
                displayCard.className = "dashboard-card processing";
                document.documentElement.style.setProperty('--accent-glow', '#3b82f6');
                centerIcon.innerText = "🔮";
                feedbackLog.innerText = "Analyzing cryptographic signature, matching vector memory patterns, and auditing AI contract risks...";

                const simulatedSpeech = mockSpokenPhrases[Math.floor(Math.random() * mockSpokenPhrases.length)];
                
                const payload = {
                    senderId: 'user_leonce_01',
                    receiverId: 'merchant_node_99',
                    voiceprintHash: 'v_hash_frontend_seal_' + Math.random().toString(36).substring(7),
                    spokenContractText: simulatedSpeech,
                    amountInCents: 7500,
                    hmacSignature: 'f0e1d2c3b4a5968778695a4b3c2d1e0f0e1d2c3b4a5968778695a4b3c2d1e0f' // Developer pass key bypass code
                };

                ws.send(JSON.stringify(payload));
            }
        });
    </script>
</body>
</html>

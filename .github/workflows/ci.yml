name: goTrust Core CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clone Repository Source Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Secure Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Open-Source Dependencies
      run: npm ci

    - name: ⚡ Verify TypeScript Compilation
      run: npx tsc --noEmit
      
    - name: 🧪 Execute Automated Vitest Unit Verification Suites
      run: npx vitest run
